name: Deploy to Production

on:
  push:
    branches:
      - main
      - master

jobs:
  notify-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Started
        run: echo "🚀 Starting deployment to production..."

  backend-deploy:
    runs-on: ubuntu-latest
    needs: notify-deployment
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy Backend to Render
        run: |
          echo "Backend deployment triggered"
          echo "Render will auto-deploy from GitHub webhook"
          echo "Monitor at: https://render.com/dashboard"
      
      - name: Test Backend Health
        run: |
          echo "Wait for Render deployment..."
          sleep 10
          curl -f https://tasnim-dairy-farm-api.onrender.com/api/health || echo "Health check failed (may be cold start)"

  frontend-deploy:
    runs-on: ubuntu-latest
    needs: notify-deployment
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy Frontend to Netlify
        run: |
          echo "Frontend deployment triggered"
          echo "Netlify will auto-deploy from GitHub webhook"
          echo "Monitor at: https://app.netlify.com"

  verify-deployment:
    runs-on: ubuntu-latest
    needs: [backend-deploy, frontend-deploy]
    steps:
      - name: Wait for Deployments
        run: sleep 30
      
      - name: Verify Services
        run: |
          echo "✓ Backend deployment: Check Render dashboard"
          echo "✓ Frontend deployment: Check Netlify dashboard"
          echo "✓ Both services should be live in 2-5 minutes"
      
      - name: Create Deployment Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: https://tasnim-dairy-farm.netlify.app" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: https://tasnim-dairy-farm-api.onrender.com" >> $GITHUB_STEP_SUMMARY
          echo "- Database: Neon PostgreSQL" >> $GITHUB_STEP_SUMMARY
